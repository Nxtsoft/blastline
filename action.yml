name: Blastline Test Impact
description: Graph-backed test impact and blast radius for PRs, built on CGraph
branding:
  icon: target
  color: orange

inputs:
  range:
    description: "git range <base>..<head>; defaults to the PR's base..head"
    required: false
    default: ""
  repo-path:
    description: path to the git repo under analysis (default $GITHUB_WORKSPACE)
    required: false
    default: ""
  src-root:
    description: repo-relative source root CGraph extracted (informational; graph-path decides)
    required: false
    default: src
  graph-path:
    description: path to CGraph graph.json for head (default <repo>/cgraph-out/graph.json)
    required: false
    default: ""
  graph-root:
    description: >-
      repo-relative source root to build the head graph from (e.g. src or .).
      When set and graph-path is empty, the Action installs CGraph
      (cgraph-version) and runs `cgraph --root <graph-root> --out` itself, so
      no consumer-supplied graph.json is needed. Mutually exclusive with
      graph-path — setting both fails loudly. Linux x64 runners only.
    required: false
    default: ""
  cgraph-version:
    description: >-
      CGraph release tag installed from Nxtsoft/CGraph (gh release download,
      asset cgraph-linux-x64.tar.gz) when graph-root triggers the turnkey
      build. Ignored when graph-root is unset.
    required: false
    default: bin-v0.2.0
  base-graph-path:
    description: optional graph.json for the base commit (improves deletion mapping)
    required: false
    default: ""
  base-graph-command:
    description: >-
      shell command that builds the BASE graph automatically: it runs inside a
      detached worktree of the range's base commit and must write
      $BLASTLINE_BASE_OUT/graph.json (e.g. `cgraph --root . --out
      "$BLASTLINE_BASE_OUT"`). Requires fetch-depth: 0. Ignored when
      base-graph-path is set explicitly.
    required: false
    default: ""
  ignore:
    description: newline-separated regexes for paths declared irrelevant to tests
    required: false
    default: ""
  min-density:
    description: edges-per-file floor below which selection fails open (default 3)
    required: false
    default: ""
  comment:
    description: post/update the PR comment (needs github-token, pull_request event)
    required: false
    default: "true"
  github-token:
    description: >-
      token used to post the PR comment (pull-requests: write) and to push the
      reach figure to figure-branch (contents: write)
    required: false
    default: ""
  figure-branch:
    description: >-
      branch in this repository that hosts the comment's reach figure, one
      directory per PR head sha (created as an orphan branch on first use).
      Needs contents: write on github-token. Empty disables the figure; a push
      the token is not allowed to make also disables it, with a warning, and
      the comment is posted without the image.
    required: false
    default: blastline-figures

outputs:
  kind:
    description: '"subset" or "all"'
    value: ${{ steps.select.outputs.kind }}
  tests:
    description: newline-separated impacted test files (empty when kind=all)
    value: ${{ steps.select.outputs.tests }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install blastline
      shell: bash
      run: bun install --frozen-lockfile --cwd "$GITHUB_ACTION_PATH"

    - name: Resolve range
      id: range
      shell: bash
      env:
        INPUT_RANGE: ${{ inputs.range }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        range="$INPUT_RANGE"
        if [ -z "$range" ]; then
          if [ -n "${PR_BASE_SHA:-}" ]; then range="${PR_BASE_SHA}..HEAD"; else range="HEAD~1..HEAD"; fi
        fi
        echo "range=$range" >> "$GITHUB_OUTPUT"

    - name: Resolve graph path
      id: graphpath
      shell: bash
      env:
        INPUT_GRAPH_PATH: ${{ inputs.graph-path }}
        INPUT_GRAPH_ROOT: ${{ inputs.graph-root }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_GRAPH_PATH" ] && [ -n "$INPUT_GRAPH_ROOT" ]; then
          echo "blastline: graph-path and graph-root are mutually exclusive — set one, not both" >&2
          exit 1
        fi
        if [ -n "$INPUT_GRAPH_PATH" ]; then
          echo "path=$INPUT_GRAPH_PATH" >> "$GITHUB_OUTPUT"
        elif [ -n "$INPUT_GRAPH_ROOT" ]; then
          echo "path=$RUNNER_TEMP/blastline-turnkey-graph/graph.json" >> "$GITHUB_OUTPUT"
        else
          echo "path=" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve turnkey cache key
      id: turnkeykey
      if: ${{ inputs.graph-path == '' && inputs.graph-root != '' }}
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo-path }}
        INPUT_ROOT: ${{ inputs.graph-root }}
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        # The graph's own sha256-merkle-v1 content root (embedded in
        # graph.json) isn't known until after the build, so the cache key
        # is the tree hash of graph-root instead — deterministic and
        # available before cgraph ever runs.
        if [ "$INPUT_ROOT" = "." ]; then
          hash=$(git -C "$repo" rev-parse "HEAD^{tree}")
        else
          hash=$(git -C "$repo" rev-parse "HEAD:$INPUT_ROOT")
        fi
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - name: Cache turnkey graph
      id: turnkeycache
      if: ${{ inputs.graph-path == '' && inputs.graph-root != '' }}
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/blastline-turnkey-graph
        key: blastline-graph-v1-${{ inputs.cgraph-version }}-${{ steps.turnkeykey.outputs.hash }}

    - name: Install cgraph (prebuilt release binaries)
      if: ${{ inputs.graph-path == '' && inputs.graph-root != '' && steps.turnkeycache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CGRAPH_VERSION: ${{ inputs.cgraph-version }}
      run: |
        set -euo pipefail
        gh release download "$CGRAPH_VERSION" --repo Nxtsoft/CGraph \
          --pattern cgraph-linux-x64.tar.gz --output cgraph-bin.tar.gz
        mkdir -p "$HOME/.local/bin"
        tar -xzf cgraph-bin.tar.gz -C "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build graph from graph-root (turnkey)
      if: ${{ inputs.graph-path == '' && inputs.graph-root != '' && steps.turnkeycache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo-path }}
        INPUT_ROOT: ${{ inputs.graph-root }}
        OUT_DIR: ${{ runner.temp }}/blastline-turnkey-graph
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        mkdir -p "$OUT_DIR"
        cgraph --root "$repo/$INPUT_ROOT" --out "$OUT_DIR"
        test -f "$OUT_DIR/graph.json" || {
          echo "cgraph did not produce \$OUT_DIR/graph.json" >&2
          exit 1
        }

    - name: Build base graph at the range's base commit
      id: basegraph
      if: ${{ inputs.base-graph-command != '' && inputs.base-graph-path == '' }}
      shell: bash
      env:
        RANGE: ${{ steps.range.outputs.range }}
        BASE_CMD: ${{ inputs.base-graph-command }}
        INPUT_REPO: ${{ inputs.repo-path }}
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        # The command runs against the exact commit the diff is taken from, so
        # deletion line numbers in the diff match the base graph's spans.
        base_sha=$(git -C "$repo" rev-parse "${RANGE%%..*}^{commit}")
        base_src="$RUNNER_TEMP/blastline-base-src"
        git -C "$repo" worktree add --detach "$base_src" "$base_sha"
        export BLASTLINE_BASE_OUT="$RUNNER_TEMP/blastline-base-graph"
        mkdir -p "$BLASTLINE_BASE_OUT"
        (cd "$base_src" && eval "$BASE_CMD")
        test -f "$BLASTLINE_BASE_OUT/graph.json" || {
          echo "base-graph-command did not produce \$BLASTLINE_BASE_OUT/graph.json" >&2
          exit 1
        }
        echo "path=$BLASTLINE_BASE_OUT/graph.json" >> "$GITHUB_OUTPUT"

    - name: Select impacted tests
      id: select
      shell: bash
      env:
        RANGE: ${{ steps.range.outputs.range }}
        INPUT_REPO: ${{ inputs.repo-path }}
        INPUT_GRAPH: ${{ steps.graphpath.outputs.path }}
        INPUT_BASE_GRAPH: ${{ inputs.base-graph-path }}
        AUTO_BASE_GRAPH: ${{ steps.basegraph.outputs.path }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_MIN_DENSITY: ${{ inputs.min-density }}
      run: |
        set -euo pipefail
        range="$RANGE"
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        base_graph="$INPUT_BASE_GRAPH"
        [ -z "$base_graph" ] && base_graph="${AUTO_BASE_GRAPH:-}"
        args=(tests "$range" --repo "$repo" --json)
        [ -n "$INPUT_GRAPH" ] && args+=(--graph "$INPUT_GRAPH")
        [ -n "$base_graph" ] && args+=(--base-graph "$base_graph")
        [ -n "$INPUT_MIN_DENSITY" ] && args+=(--min-density "$INPUT_MIN_DENSITY")
        while IFS= read -r pat; do
          [ -n "$pat" ] && args+=(--ignore "$pat")
        done <<< "$INPUT_IGNORE"
        bun "$GITHUB_ACTION_PATH/src/cli.ts" "${args[@]}" > selection.json
        cat selection.json
        kind=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("selection.json","utf8")).kind)')
        echo "kind=$kind" >> "$GITHUB_OUTPUT"
        {
          echo "tests<<BLASTLINE_EOF"
          bun -e 'const s=JSON.parse(require("fs").readFileSync("selection.json","utf8")); if(s.kind==="subset") console.log(s.tests.join("\n"))'
          echo "BLASTLINE_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Publish the reach figure
      id: figure
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' && inputs.github-token != '' && inputs.figure-branch != '' && steps.select.outputs.kind == 'subset' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RANGE: ${{ steps.range.outputs.range }}
        INPUT_REPO: ${{ inputs.repo-path }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FIGURE_BRANCH: ${{ inputs.figure-branch }}
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        out="$RUNNER_TEMP/blastline-figure"
        # The figure is an illustration of the comment, never a gate on it: if
        # drawing fails, the comment still goes out without the image.
        if ! bun "$GITHUB_ACTION_PATH/src/cli.ts" figure "$RANGE" --repo "$repo" --selection selection.json --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --out-dir "$out"; then
          echo "::warning::blastline: drawing the reach figure failed; posting the comment without it"
          exit 0
        fi
        # No SVG means nothing was mapped (a change ignored by policy, say);
        # the comment says so in words and carries no image.
        [ -f "$out/reach-dark.svg" ] || exit 0
        # The figure lives on its own branch, one directory per head sha, so
        # every past comment keeps its image. The branch is appended to, never
        # rewritten; a concurrent PR racing the push is retried on a fresh
        # clone. A token without contents: write cannot push, and the comment
        # then goes out without the figure rather than not at all.
        remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
        auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        work="$RUNNER_TEMP/blastline-figure-branch"
        for attempt in 1 2 3; do
          rm -rf "$work"
          if git -c "http.extraheader=$auth" ls-remote --exit-code --heads "$remote" "$FIGURE_BRANCH" >/dev/null 2>&1; then
            git -c "http.extraheader=$auth" clone -q --depth 1 --branch "$FIGURE_BRANCH" "$remote" "$work"
          else
            git init -q --initial-branch="$FIGURE_BRANCH" "$work"
          fi
          mkdir -p "$work/$HEAD_SHA"
          cp "$out"/reach-dark.svg "$out"/reach-light.svg "$work/$HEAD_SHA/"
          git -C "$work" add "$HEAD_SHA"
          # A re-run of the same commit produces byte-identical SVGs that are
          # already on the branch; that is success, not an empty commit.
          if git -C "$work" diff --cached --quiet; then
            echo "url=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$FIGURE_BRANCH/$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C "$work" -c user.name=blastline -c user.email=blastline@users.noreply.github.com \
            commit -qm "figure for $HEAD_SHA (PR #$PR_NUMBER)"
          if git -C "$work" -c "http.extraheader=$auth" push -q "$remote" "HEAD:refs/heads/$FIGURE_BRANCH" 2> "$RUNNER_TEMP/blastline-push.err"; then
            echo "url=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$FIGURE_BRANCH/$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q -i -E '403|permission|not allowed' "$RUNNER_TEMP/blastline-push.err"; then
            echo "::warning::blastline: github-token cannot push to $FIGURE_BRANCH (needs contents: write); posting the comment without the reach figure"
            cat "$RUNNER_TEMP/blastline-push.err"
            exit 0
          fi
          echo "push attempt $attempt failed, retrying" >&2
          cat "$RUNNER_TEMP/blastline-push.err" >&2
        done
        echo "::warning::blastline: could not push the reach figure after 3 attempts; posting the comment without it"

    - name: Render the PR comment
      # Always rendered, even when nothing posts it: blastline-comment.md is
      # part of the Action's output on disk (ci.yml's self-test reads it on
      # push events too).
      shell: bash
      env:
        RANGE: ${{ steps.range.outputs.range }}
        INPUT_REPO: ${{ inputs.repo-path }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FIGURE_URL: ${{ steps.figure.outputs.url }}
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        args=(comment "$RANGE" --repo "$repo" --selection selection.json --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY")
        [ -n "${PR_NUMBER:-}" ] && args+=(--pr "$PR_NUMBER")
        # On pull_request the range ends at GitHub's merge commit, which is the
        # right thing to diff (base.sha is its first parent) but not the commit
        # the reviewer knows. Links and captions name the PR head instead.
        [ -n "${PR_HEAD_SHA:-}" ] && args+=(--head-sha "$PR_HEAD_SHA")
        [ -n "${FIGURE_URL:-}" ] && args+=(--figure-url "$FIGURE_URL")
        bun "$GITHUB_ACTION_PATH/src/cli.ts" "${args[@]}" > blastline-comment.md

    - name: Post or update the PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' && inputs.github-token != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        # One comment per PR, found by the marker on its first line and edited
        # in place. (`gh pr comment --edit-last` needs the viewer query, which
        # the Actions token cannot make, so it posted a new comment on every
        # push.)
        # --paginate emits one JSON array per page and jq runs once per page,
        # so a match may print once per page; comments come oldest first, and
        # the newest marker comment sits on the last page that has one, which
        # is the line tail keeps.
        existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
          | jq -r '[.[] | select(.body | startswith("<!-- blastline:test-impact -->"))] | last | .id // empty' \
          | tail -n 1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@blastline-comment.md > /dev/null
          echo "updated comment $existing"
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@blastline-comment.md --jq '"posted comment " + (.id|tostring)'
        fi
