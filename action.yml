name: Blastline Test Impact
description: Graph-backed test impact and blast radius for PRs, built on CGraph
branding:
  icon: target
  color: orange

inputs:
  range:
    description: "git range <base>..<head>; defaults to the PR's base..head"
    required: false
    default: ""
  repo-path:
    description: path to the git repo under analysis (default $GITHUB_WORKSPACE)
    required: false
    default: ""
  src-root:
    description: repo-relative source root CGraph extracted (informational; graph-path decides)
    required: false
    default: src
  graph-path:
    description: path to CGraph graph.json for head (default <repo>/cgraph-out/graph.json)
    required: false
    default: ""
  graph-root:
    description: >-
      repo-relative source root to build the head graph from (e.g. src or .).
      When set and graph-path is empty, the Action installs CGraph
      (cgraph-version) and runs `cgraph --root <graph-root> --out` itself, so
      no consumer-supplied graph.json is needed. Mutually exclusive with
      graph-path — setting both fails loudly. Linux x64 runners only.
    required: false
    default: ""
  cgraph-version:
    description: >-
      CGraph release tag installed from Nxtsoft/CGraph (gh release download,
      asset cgraph-linux-x64.tar.gz) when graph-root is set: it builds the
      graph and runs `cgraph change-context` for the brief's symbol changes.
      bin-v0.5.0 is the first release whose node ids are repo-relative, so a base
      and a head graph share ids; bin-v0.4.0 is the first with change-context. Ignored when
      graph-root is unset.
    required: false
    default: bin-v0.5.0
  base-graph-path:
    description: optional graph.json for the base commit (improves deletion mapping)
    required: false
    default: ""
  base-graph-command:
    description: >-
      shell command that builds the BASE graph automatically: it runs inside a
      detached worktree of the range's base commit and must write
      $BLASTLINE_BASE_OUT/graph.json (e.g. `cgraph --root . --out
      "$BLASTLINE_BASE_OUT"`). Requires fetch-depth: 0. Ignored when
      base-graph-path is set explicitly.
    required: false
    default: ""
  ignore:
    description: newline-separated regexes for paths declared irrelevant to tests
    required: false
    default: ""
  min-density:
    description: edges-per-file floor below which selection fails open (default 3)
    required: false
    default: ""
  comment:
    description: post/update the PR comment (needs github-token, pull_request event)
    required: false
    default: "true"
  github-token:
    description: >-
      token used to post the PR comment (pull-requests: write), the check run
      (checks: write) and to push the reach figure to figure-branch
      (contents: write)
    required: false
    default: ""
  check-run:
    description: >-
      also post a `blastline` check run on the PR head sha, with annotations
      on the changed lines with the highest reach (needs checks: write on
      github-token; posted only when the comment is). A fork's read-only token
      cannot post it, and the run warns instead of failing.
    required: false
    default: "true"
  figure:
    description: >-
      how the comment carries the reach figure: "auto" (default) embeds an
      image on a public repository and a mermaid block on a private one, since
      GitHub fetches comment images anonymously and cannot read a private
      repository's files; "image" and "mermaid" force one; "none" leaves the
      figure out.
    required: false
    default: auto
  figure-branch:
    description: >-
      branch in this repository that hosts the image form of the figure, one
      directory per PR head sha (created as an orphan branch on first use).
      Needs contents: write on github-token. Empty disables the image; a push
      the token is not allowed to make also disables it, with a warning, and
      the comment is posted without the image.
    required: false
    default: blastline-figures

outputs:
  kind:
    description: '"subset" or "all"'
    value: ${{ steps.select.outputs.kind }}
  tests:
    description: newline-separated impacted test files (empty when kind=all)
    value: ${{ steps.select.outputs.tests }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install blastline
      shell: bash
      run: bun install --frozen-lockfile --cwd "$GITHUB_ACTION_PATH"

    - name: Resolve range
      id: range
      shell: bash
      env:
        INPUT_RANGE: ${{ inputs.range }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        range="$INPUT_RANGE"
        if [ -z "$range" ]; then
          if [ -n "${PR_BASE_SHA:-}" ]; then range="${PR_BASE_SHA}..HEAD"; else range="HEAD~1..HEAD"; fi
        fi
        echo "range=$range" >> "$GITHUB_OUTPUT"

    - name: Fetch checkpoint refs
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo-path }}
      run: |
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        # An Entire checkpoint (what the agent was asked, which tests it ran)
        # lives on its own ref, pushed separately from the branch. The brief
        # reads it through each commit's Entire-Checkpoint trailer; a repo
        # without them gets "no checkpoints on this branch", not a failure.
        git -C "$repo" fetch -q origin '+refs/entire/checkpoints/*:refs/entire/checkpoints/*' 2>/dev/null \
          || echo "blastline: no checkpoint refs fetched"

    - name: Resolve graph path
      id: graphpath
      shell: bash
      env:
        INPUT_GRAPH_PATH: ${{ inputs.graph-path }}
        INPUT_GRAPH_ROOT: ${{ inputs.graph-root }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_GRAPH_PATH" ] && [ -n "$INPUT_GRAPH_ROOT" ]; then
          echo "blastline: graph-path and graph-root are mutually exclusive — set one, not both" >&2
          exit 1
        fi
        if [ -n "$INPUT_GRAPH_PATH" ]; then
          echo "path=$INPUT_GRAPH_PATH" >> "$GITHUB_OUTPUT"
        elif [ -n "$INPUT_GRAPH_ROOT" ]; then
          echo "path=$RUNNER_TEMP/blastline-turnkey-graph/graph.json" >> "$GITHUB_OUTPUT"
        else
          echo "path=" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve turnkey cache key
      id: turnkeykey
      if: ${{ inputs.graph-path == '' && inputs.graph-root != '' }}
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo-path }}
        INPUT_ROOT: ${{ inputs.graph-root }}
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        # The graph's own sha256-merkle-v1 content root (embedded in
        # graph.json) isn't known until after the build, so the cache key
        # is the tree hash of graph-root instead — deterministic and
        # available before cgraph ever runs.
        if [ "$INPUT_ROOT" = "." ]; then
          hash=$(git -C "$repo" rev-parse "HEAD^{tree}")
        else
          hash=$(git -C "$repo" rev-parse "HEAD:$INPUT_ROOT")
        fi
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - name: Cache turnkey graph
      id: turnkeycache
      if: ${{ inputs.graph-path == '' && inputs.graph-root != '' }}
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/blastline-turnkey-graph
        key: blastline-graph-v1-${{ inputs.cgraph-version }}-${{ steps.turnkeykey.outputs.hash }}

    - name: Mark the cached graph current
      if: ${{ inputs.graph-path == '' && inputs.graph-root != '' && steps.turnkeycache.outputs.cache-hit == 'true' }}
      shell: bash
      env:
        OUT_DIR: ${{ runner.temp }}/blastline-turnkey-graph
      run: |
        # The cache key is the tree hash of graph-root at HEAD, so a hit is a
        # graph of exactly this source tree, however old the restored mtime
        # is. Without this a commit that touches nothing under graph-root
        # (docs, the workflow) restores a graph older than itself and the
        # mtime guard fails open on a graph that is, by construction, fresh.
        touch "$OUT_DIR/graph.json"

    - name: Install cgraph (prebuilt release binaries)
      # Installed on every turnkey run, cache hit or not: the graph is cached,
      # change-context over the range's diff is not.
      if: ${{ inputs.graph-path == '' && inputs.graph-root != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CGRAPH_VERSION: ${{ inputs.cgraph-version }}
      run: |
        set -euo pipefail
        gh release download "$CGRAPH_VERSION" --repo Nxtsoft/CGraph \
          --pattern cgraph-linux-x64.tar.gz --output cgraph-bin.tar.gz
        mkdir -p "$HOME/.local/bin"
        tar -xzf cgraph-bin.tar.gz -C "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build graph from graph-root (turnkey)
      if: ${{ inputs.graph-path == '' && inputs.graph-root != '' && steps.turnkeycache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo-path }}
        INPUT_ROOT: ${{ inputs.graph-root }}
        OUT_DIR: ${{ runner.temp }}/blastline-turnkey-graph
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        mkdir -p "$OUT_DIR"
        cgraph --root "$repo/$INPUT_ROOT" --out "$OUT_DIR"
        test -f "$OUT_DIR/graph.json" || {
          echo "cgraph did not produce \$OUT_DIR/graph.json" >&2
          exit 1
        }

    - name: Build base graph at the range's base commit
      id: basegraph
      if: ${{ inputs.base-graph-command != '' && inputs.base-graph-path == '' }}
      shell: bash
      env:
        RANGE: ${{ steps.range.outputs.range }}
        BASE_CMD: ${{ inputs.base-graph-command }}
        INPUT_REPO: ${{ inputs.repo-path }}
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        # The command runs against the exact commit the diff is taken from, so
        # deletion line numbers in the diff match the base graph's spans.
        base_sha=$(git -C "$repo" rev-parse "${RANGE%%..*}^{commit}")
        base_src="$RUNNER_TEMP/blastline-base-src"
        git -C "$repo" worktree add --detach "$base_src" "$base_sha"
        export BLASTLINE_BASE_OUT="$RUNNER_TEMP/blastline-base-graph"
        mkdir -p "$BLASTLINE_BASE_OUT"
        (cd "$base_src" && eval "$BASE_CMD")
        test -f "$BLASTLINE_BASE_OUT/graph.json" || {
          echo "base-graph-command did not produce \$BLASTLINE_BASE_OUT/graph.json" >&2
          exit 1
        }
        echo "path=$BLASTLINE_BASE_OUT/graph.json" >> "$GITHUB_OUTPUT"

    - name: Classify symbol changes (cgraph change-context)
      id: changecontext
      if: ${{ inputs.graph-path == '' && inputs.graph-root != '' }}
      shell: bash
      env:
        RANGE: ${{ steps.range.outputs.range }}
        INPUT_REPO: ${{ inputs.repo-path }}
        INPUT_ROOT: ${{ inputs.graph-root }}
        INPUT_BASE_GRAPH: ${{ inputs.base-graph-path }}
        AUTO_BASE_GRAPH: ${{ steps.basegraph.outputs.path }}
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        # Symbol changes are context for the brief, never a gate on it: any
        # failure here costs the Symbols row and the removed-symbol claims,
        # and the brief says so in its footer.
        base_src="$RUNNER_TEMP/blastline-base-src"
        if [ ! -d "$base_src" ]; then
          if ! base_sha=$(git -C "$repo" rev-parse "${RANGE%%..*}^{commit}") \
            || ! git -C "$repo" worktree add -q --detach "$base_src" "$base_sha"; then
            echo "::warning::blastline: cannot check out the range's base for change-context (needs fetch-depth: 0)"
            exit 0
          fi
        fi
        # The same checkout gives the base graph the removed-symbol claims
        # and deletion mapping need, unless the consumer supplied one.
        if [ -z "${INPUT_BASE_GRAPH:-}" ] && [ -z "${AUTO_BASE_GRAPH:-}" ]; then
          base_out="$RUNNER_TEMP/blastline-turnkey-base-graph"
          mkdir -p "$base_out"
          if cgraph --root "$base_src/$INPUT_ROOT" --out "$base_out" && [ -f "$base_out/graph.json" ]; then
            echo "base_graph=$base_out/graph.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::blastline: could not build the base graph; removed-symbol claims are not checked"
          fi
        fi
        diff="$RUNNER_TEMP/blastline-range.diff"
        git -C "$repo" diff --unified=0 "$RANGE" > "$diff"
        out="$RUNNER_TEMP/blastline-change-context.json"
        # The budget bounds change-context's output in tokens (bytes/4), and
        # the change evidence it must always carry grows with the diff: 20000
        # held a 5-file diff and refused a 26-file one, which 40000 held.
        # Runtime is flat (under a second either way), and the brief prints
        # what a budget shed, so the budget follows the diff's size.
        budget=$((20000 + $(wc -c < "$diff") / 2))
        if cgraph change-context --base-root "$base_src" --target-root "$repo" --diff "$diff" --budget "$budget" > "$out"; then
          echo "path=$out" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::blastline: cgraph change-context failed; the brief carries no symbol changes"
          cat "$out" >&2 || true
        fi

    - name: Select impacted tests
      id: select
      shell: bash
      env:
        RANGE: ${{ steps.range.outputs.range }}
        INPUT_REPO: ${{ inputs.repo-path }}
        INPUT_GRAPH: ${{ steps.graphpath.outputs.path }}
        INPUT_BASE_GRAPH: ${{ inputs.base-graph-path }}
        AUTO_BASE_GRAPH: ${{ steps.basegraph.outputs.path }}
        TURNKEY_BASE_GRAPH: ${{ steps.changecontext.outputs.base_graph }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_MIN_DENSITY: ${{ inputs.min-density }}
      run: |
        set -euo pipefail
        range="$RANGE"
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        base_graph="$INPUT_BASE_GRAPH"
        [ -z "$base_graph" ] && base_graph="${AUTO_BASE_GRAPH:-}"
        [ -z "$base_graph" ] && base_graph="${TURNKEY_BASE_GRAPH:-}"
        args=(tests "$range" --repo "$repo" --json)
        [ -n "$INPUT_GRAPH" ] && args+=(--graph "$INPUT_GRAPH")
        [ -n "$base_graph" ] && args+=(--base-graph "$base_graph")
        [ -n "$INPUT_MIN_DENSITY" ] && args+=(--min-density "$INPUT_MIN_DENSITY")
        while IFS= read -r pat; do
          [ -n "$pat" ] && args+=(--ignore "$pat")
        done <<< "$INPUT_IGNORE"
        bun "$GITHUB_ACTION_PATH/src/cli.ts" "${args[@]}" > selection.json
        cat selection.json
        kind=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("selection.json","utf8")).kind)')
        echo "kind=$kind" >> "$GITHUB_OUTPUT"
        echo "base_graph=$base_graph" >> "$GITHUB_OUTPUT"
        {
          echo "tests<<BLASTLINE_EOF"
          bun -e 'const s=JSON.parse(require("fs").readFileSync("selection.json","utf8")); if(s.kind==="subset") console.log(s.tests.join("\n"))'
          echo "BLASTLINE_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Publish the reach figure
      id: figure
      # An image only where GitHub can fetch it: a public repository. A private
      # repository gets the mermaid block instead (see the render step).
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' && inputs.github-token != '' && inputs.figure-branch != '' && steps.select.outputs.kind == 'subset' && (inputs.figure == 'image' || (inputs.figure == 'auto' && github.event.repository.private == false)) }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RANGE: ${{ steps.range.outputs.range }}
        INPUT_REPO: ${{ inputs.repo-path }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FIGURE_BRANCH: ${{ inputs.figure-branch }}
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        out="$RUNNER_TEMP/blastline-figure"
        # The figure is an illustration of the comment, never a gate on it: if
        # drawing fails, the comment still goes out without the image.
        if ! bun "$GITHUB_ACTION_PATH/src/cli.ts" figure "$RANGE" --repo "$repo" --selection selection.json --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --out-dir "$out"; then
          echo "::warning::blastline: drawing the reach figure failed; posting the comment without it"
          exit 0
        fi
        # No SVG means nothing was mapped (a change ignored by policy, say);
        # the comment says so in words and carries no image.
        [ -f "$out/reach-dark.svg" ] || exit 0
        # The figure lives on its own branch, one directory per head sha, so
        # every past comment keeps its image. The branch is appended to, never
        # rewritten; a concurrent PR racing the push is retried on a fresh
        # clone. A token without contents: write cannot push, and the comment
        # then goes out without the figure rather than not at all.
        remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
        auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        work="$RUNNER_TEMP/blastline-figure-branch"
        for attempt in 1 2 3; do
          rm -rf "$work"
          if git -c "http.extraheader=$auth" ls-remote --exit-code --heads "$remote" "$FIGURE_BRANCH" >/dev/null 2>&1; then
            git -c "http.extraheader=$auth" clone -q --depth 1 --branch "$FIGURE_BRANCH" "$remote" "$work"
          else
            git init -q --initial-branch="$FIGURE_BRANCH" "$work"
          fi
          mkdir -p "$work/$HEAD_SHA"
          cp "$out"/reach-dark.svg "$out"/reach-light.svg "$work/$HEAD_SHA/"
          git -C "$work" add "$HEAD_SHA"
          # A re-run of the same commit produces byte-identical SVGs that are
          # already on the branch; that is success, not an empty commit.
          if git -C "$work" diff --cached --quiet; then
            echo "url=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$FIGURE_BRANCH/$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C "$work" -c user.name=blastline -c user.email=blastline@users.noreply.github.com \
            commit -qm "figure for $HEAD_SHA (PR #$PR_NUMBER)"
          if git -C "$work" -c "http.extraheader=$auth" push -q "$remote" "HEAD:refs/heads/$FIGURE_BRANCH" 2> "$RUNNER_TEMP/blastline-push.err"; then
            echo "url=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$FIGURE_BRANCH/$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q -i -E '403|permission|not allowed' "$RUNNER_TEMP/blastline-push.err"; then
            echo "::warning::blastline: github-token cannot push to $FIGURE_BRANCH (needs contents: write); posting the comment without the reach figure"
            cat "$RUNNER_TEMP/blastline-push.err"
            exit 0
          fi
          echo "push attempt $attempt failed, retrying" >&2
          cat "$RUNNER_TEMP/blastline-push.err" >&2
        done
        echo "::warning::blastline: could not push the reach figure after 3 attempts; posting the comment without it"

    - name: Find the existing comment
      id: existing
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' && inputs.github-token != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        # One comment per PR, found by the marker on its first line and edited
        # in place. (`gh pr comment --edit-last` needs the viewer query, which
        # the Actions token cannot make, so it posted a new comment on every
        # push.)
        # --paginate emits one JSON array per page and jq runs once per page,
        # so a match may print once per page; comments come oldest first, and
        # the newest marker comment sits on the last page that has one, which
        # is the line tail keeps.
        existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
          | jq -r '[.[] | select(.body | startswith("<!-- blastline:test-impact -->"))] | last | .id // empty' \
          | tail -n 1)
        echo "id=$existing" >> "$GITHUB_OUTPUT"
        # The previous brief's embedded snapshot is what "since push" is
        # measured against.
        if [ -n "$existing" ]; then
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --jq .body > blastline-previous.md
          echo "previous=blastline-previous.md" >> "$GITHUB_OUTPUT"
        fi

    - name: Render the PR brief
      # Always rendered, even when nothing posts it: blastline-comment.md and
      # blastline-brief.json are part of the Action's output on disk (ci.yml's
      # self-test reads them on push events too).
      shell: bash
      env:
        RANGE: ${{ steps.range.outputs.range }}
        INPUT_REPO: ${{ inputs.repo-path }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FIGURE_URL: ${{ steps.figure.outputs.url }}
        FIGURE_MODE: ${{ inputs.figure }}
        REPO_PRIVATE: ${{ github.event.repository.private }}
        BASE_GRAPH: ${{ steps.select.outputs.base_graph }}
        CHANGE_CONTEXT: ${{ steps.changecontext.outputs.path }}
        PREVIOUS: ${{ steps.existing.outputs.previous }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_GRAPH: ${{ steps.graphpath.outputs.path }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_EVENT: ${{ github.event_name == 'pull_request' }}
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-$GITHUB_WORKSPACE}"
        args=(brief "$RANGE" --repo "$repo" --selection selection.json --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --annotations 50 --json)
        # The head graph gives each changed symbol its line range, so an edit
        # inside a function body is attributed to that function.
        [ -n "${INPUT_GRAPH:-}" ] && args+=(--graph "$INPUT_GRAPH")
        [ -n "${BASE_GRAPH:-}" ] && args+=(--base-graph "$BASE_GRAPH")
        [ -n "${CHANGE_CONTEXT:-}" ] && args+=(--change-context "$CHANGE_CONTEXT")
        [ -n "${PREVIOUS:-}" ] && args+=(--previous "$PREVIOUS")
        # Who has looked: the PR's reviews, so the Reviewed-by row can say when
        # nobody but the author has. A token that cannot list them leaves the
        # row to name owners only.
        if [ -n "${PR_AUTHOR:-}" ]; then
          args+=(--author "$PR_AUTHOR")
          if [ -n "${GH_TOKEN:-}" ] && [ -n "${PR_NUMBER:-}" ] \
            && gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --jq '[.[] | {login: .user.login, state: .state}]' > blastline-reviews.json 2>/dev/null; then
            args+=(--reviews blastline-reviews.json)
          fi
        fi
        # The PR body is a claim like any other: an empty one is a placeholder,
        # a name in code font the diff does not carry is a phantom change.
        if [ "${PR_EVENT:-false}" = "true" ]; then
          printf '%s' "${PR_BODY:-}" > blastline-narrative.md
          args+=(--narrative blastline-narrative.md)
        fi
        [ -n "${PR_NUMBER:-}" ] && args+=(--pr "$PR_NUMBER")
        # On pull_request the range ends at GitHub's merge commit, which is the
        # right thing to diff (base.sha is its first parent) but not the commit
        # the reviewer knows. Links and captions name the PR head instead.
        [ -n "${PR_HEAD_SHA:-}" ] && args+=(--head-sha "$PR_HEAD_SHA")
        # GitHub fetches comment images anonymously, so a private repository's
        # raw file is a broken image there; it gets a mermaid block instead.
        if [ "$FIGURE_MODE" = "mermaid" ] || { [ "$FIGURE_MODE" = "auto" ] && [ "${REPO_PRIVATE:-false}" = "true" ]; }; then
          args+=(--figure-mermaid)
        elif [ -n "${FIGURE_URL:-}" ]; then
          args+=(--figure-url "$FIGURE_URL")
        fi
        bun "$GITHUB_ACTION_PATH/src/cli.ts" "${args[@]}" > blastline-brief.json
        bun -e 'const b = JSON.parse(require("fs").readFileSync("blastline-brief.json", "utf8")); require("fs").writeFileSync("blastline-comment.md", b.markdown); require("fs").writeFileSync("blastline-check-run.json", JSON.stringify(b.check_run))'
        cat blastline-comment.md

    - name: Post or update the PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' && inputs.github-token != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EXISTING: ${{ steps.existing.outputs.id }}
      run: |
        set -euo pipefail
        if [ -n "${EXISTING:-}" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" -F body=@blastline-comment.md > /dev/null
          echo "updated comment $EXISTING"
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@blastline-comment.md --jq '"posted comment " + (.id|tostring)'
        fi

    - name: Post the check run
      # Same guard as the comment: a fork PR's token is read-only, so the
      # check run is attempted only where the comment is, and a refusal is
      # a warning, since the brief is already in the comment.
      if: ${{ inputs.check-run == 'true' && inputs.comment == 'true' && github.event_name == 'pull_request' && inputs.github-token != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        if ! gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input blastline-check-run.json \
          --jq '"check run " + (.id|tostring) + " on " + .head_sha[0:7] + ": " + (.output.annotations_count|tostring) + " annotations"'; then
          echo "::warning::blastline: could not post the check run (github-token needs checks: write)"
        fi
