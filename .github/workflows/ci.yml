name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test

  deletion-selftest:
    # End-to-end proof of base-graph automation, dogfooded on this repo: a
    # throwaway commit deletes src/mcp.ts, head+base graphs are built with the
    # prebuilt CGraph binary (base via base-graph-command in a merge-base
    # worktree at a DIFFERENT path), and the pure deletion must select the
    # surviving dependent test — impossible without the base-graph walk.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install cgraph (prebuilt release binaries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download bin-v0.1.0 --repo Nxtsoft/CGraph \
            --pattern cgraph-linux-x64.tar.gz --output cgraph-bin.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf cgraph-bin.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Delete a source file in a throwaway commit
        run: |
          set -euo pipefail
          git rm -q src/mcp.ts
          git -c user.name=selftest -c user.email=selftest@blastline.invalid \
            commit -qm "selftest: delete src/mcp.ts"
      - name: Build the head graph
        run: cgraph --root . --out "$RUNNER_TEMP/head-graph"
      - id: blastline
        uses: ./
        with:
          range: HEAD~1..HEAD
          graph-path: ${{ runner.temp }}/head-graph/graph.json
          base-graph-command: cgraph --root . --out "$BLASTLINE_BASE_OUT"
          comment: "false"
      - name: Assert the deletion selected its dependent test
        env:
          KIND: ${{ steps.blastline.outputs.kind }}
          TESTS: ${{ steps.blastline.outputs.tests }}
        run: |
          set -euo pipefail
          echo "kind=$KIND"
          echo "$TESTS"
          test "$KIND" = "subset"
          echo "$TESTS" | grep -q "src/mcp.test.ts"

  action-selftest:
    # Exercises the composite action end-to-end. Runners have no CGraph
    # binary and the repo ships no graph.json, so the honest outcome is
    # kind=all with a graph-unavailable reason — assert exactly that.
    # On pull_request events the action also posts the real PR comment.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: blastline
        uses: ./
        with:
          range: HEAD~1..HEAD
          github-token: ${{ github.token }}
      - name: Assert honest fail-open
        env:
          KIND: ${{ steps.blastline.outputs.kind }}
        run: |
          set -euo pipefail
          echo "kind=$KIND"
          test "$KIND" = "all"
          grep -q "graph-unavailable" selection.json
          grep -q "Run the full suite" blastline-comment.md
